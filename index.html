<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>May's flower garden</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#4fa83f}
body{overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:"Sarabun","Noto Sans Thai",sans-serif;font-weight:700}
canvas{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.box{position:fixed;font:inherit;color:#2b2b2b;background:#fff8dc;border:3px solid #2b2b2b;box-shadow:4px 4px 0 #2b2b2b;padding:6px 14px;border-radius:0}
.hint{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 100px);white-space:nowrap;pointer-events:none;transition:opacity .5s}
.hint.gone{opacity:0}
.logo{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 48px);display:flex;align-items:center;gap:10px;white-space:nowrap;pointer-events:none;font-family:"Press Start 2P",ui-monospace,monospace;font-weight:400;font-size:clamp(11px,3.6vw,16px);color:#fff8dc;text-shadow:2px 2px 0 #d6336c,4px 4px 0 #2b2b2b}
.logo svg{width:28px;height:20px;shape-rendering:crispEdges;filter:drop-shadow(2px 2px 0 #2b2b2b)}
button.box{right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);cursor:pointer}
button.box:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #2b2b2b}
button.box:focus-visible{outline:3px solid #d62828;outline-offset:3px}
.msg{transform:translate(-50%,-100%);max-width:70vw;text-align:center;font-size:.95rem;padding:4px 12px;pointer-events:none;animation:pop 2.4s forwards}
@keyframes pop{0%{opacity:0;margin-top:8px}10%{opacity:1;margin-top:0}80%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-14px}}
@media (prefers-reduced-motion:reduce){.msg{animation:fade 2.4s forwards}@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="c"></canvas>
<div class="logo"><svg viewBox="0 0 7 5" aria-hidden="true"><g fill="#ff6b9d"><rect x="2" y="0" width="3" height="1"/><rect x="1" y="1" width="5" height="1"/><rect x="0" y="2" width="3" height="1"/><rect x="4" y="2" width="3" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/></g><rect x="3" y="2" width="1" height="1" fill="#ffd23f"/></svg><span>flowers for may</span></div>
<div class="box hint" id="hint">จิ้มที่สวนเพื่อปลูกดอกไม้</div>
<button class="box" id="clear">ล้างสวน</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S,W,H,hY,bgc;
const PALS=[['#ff6b9d','#ffc2d9','#ffd23f'],['#e63946','#ff8a8f','#ffd23f'],['#9d4edd','#d0a2f7','#ffd23f'],['#f5f5f5','#ffffff','#f4a300'],['#ffd23f','#fff3a0','#6b3e1e'],['#4d9de0','#a8d4ff','#ffd23f'],['#ff8c42','#ffc08a','#ffd23f']];
const SPR=[
 ["..ppp..",".plppp.","pppcppp",".ppppp.","..ppp.."],
 ["p.p.p","ppppp","pplpp",".ppp.",".ppp."],
 [".ppp.","pplpp","plcpp","ppppp",".ppp."],
 ["..p.p..",".ppppp.","ppcccpp","pcccccp","ppcccpp",".ppppp.","..p.p.."],
 [".ppp.","plccp","pcpcp",".ppp."],
 [".p.","plp",".p.","plp","ppp",".p."],
 [".ppp.","ppcpp","pcccp","ppcpp",".ppp."],
 ["pp.pp","ppppp",".pcp.","ppppp","pp.pp"]
];
const FIX=[null,null,null,['#ffd23f','#fff3a0','#6b3e1e'],['#d62828','#ff6b6b','#8a0a14'],['#8e44ad','#c39bd3','#8e44ad'],['#ff3b30','#ff8a80','#222222'],['#ffb7c5','#ffe0e8','#ff6b9d']];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function px(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w||1,h||1)}
function sprite(g,x,y,t,pal){
  const s=SPR[t],h=s.length,w=s[0].length,ox=x-(w>>1),oy=y-h+1;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=s[j][i];if(ch!=='.')px(g,ox+i,oy+j,1,1,ch==='p'?pal[0]:ch==='l'?pal[1]:pal[2])}
}
function stem(g,x,top,base){
  px(g,x,top,1,base-top+1,'#2e7d32');
  const m=top+((base-top)>>1);
  if(base-top>5){px(g,x+1,m,1,1,'#43a047');px(g,x+2,m-1,1,1,'#43a047');px(g,x-1,m+3,1,1,'#43a047');px(g,x-2,m+2,1,1,'#43a047')}
}
function buildBg(){
  bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;
  const g=bgc.getContext('2d'),r=rng(7);
  const sky=['#7cc8ff','#8fd3ff','#a2dcff','#b4e4ff','#c8edff'];
  for(let y=0;y<hY;y++)px(g,0,y,W,1,sky[Math.min(4,y*5/hY|0)]);
  px(g,W-26,10,12,12,'#ffe066');px(g,W-28,12,16,8,'#ffe066');px(g,W-24,8,8,16,'#ffe066');px(g,W-24,12,8,8,'#fff3a0');
  for(let k=0;k<4;k++){const cx=r()*W|0,cy=6+r()*(hY*.45)|0;px(g,cx+3,cy,10,3,'#fff');px(g,cx,cy+2,18,3,'#fff');px(g,cx+6,cy-2,6,3,'#fff')}
  for(let x=0;x<W;x++){
    const a=hY-8-Math.round(5*Math.sin(x/19+2)+3*Math.sin(x/8));
    px(g,x,a,1,hY-a+2,'#a5df93');
    const b=hY-3-Math.round(4*Math.sin(x/13)+2*Math.sin(x/5+1));
    px(g,x,b,1,hY-b+2,'#7ccf6a');
  }
  const gr=['#62c451','#5bb94b','#53ae43','#4aa23c','#429635'];
  for(let y=hY;y<H;y++)px(g,0,y,W,1,gr[((y-hY)/5|0)%5]);
  for(let n=0;n<W*H/18;n++){const x=r()*W|0,y=hY+r()*(H-hY)|0,l=r()<.5;px(g,x,y,1,2,l?'#86e676':'#2f7a2b')}
  const list=[],n=Math.floor(W*(H-hY)/900);
  for(let i=0;i<n;i++){const tt=r()*SPR.length|0;list.push({x:3+r()*(W-6)|0,y:hY+5+r()*(H-hY-6)|0,t:tt,p:FIX[tt]||PALS[r()*PALS.length|0],h:4+r()*5|0})}
  list.sort((a,b)=>a.y-b.y);
  for(const f of list){stem(g,f.x,f.y-f.h,f.y);sprite(g,f.x,f.y-f.h,f.t,f.p)}
}
function resize(){
  S=Math.max(3,Math.round(innerWidth/170));
  W=Math.ceil(innerWidth/S);H=Math.ceil(innerHeight/S);hY=Math.floor(H*.42);
  cv.width=W;cv.height=H;cv.style.width=W*S+'px';cv.style.height=H*S+'px';
  ctx.imageSmoothingEnabled=false;buildBg();
}
addEventListener('resize',resize);resize();
const flowers=[],sparks=[],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEP=reduce?1:35;
const MESSAGES=[
  'รักบ๋ี',
  'เธอจะมีเค้าทุกวัน',
  'ไม่ว่าอะไรจะเกิดขึ้น เค้าจะโอ๋เธอเสมอ',
  'ถ้าหากเป็นไปได้ เค้าอยากเอาดอกไม้ทั้งโลกมาให้เธอ',
  'เค้าชอบให้เธอยิ้ม',
  'เค้าเป็นห่วงเธอ',
  'เธอเป็นคนเก่งของเค้าเสมอ',
  'รักแฟน'
];
let lastMsg=-1;
function showMsg(cx,cy){
  if(!MESSAGES.length)return;
  lastMsg++;const i=lastMsg%MESSAGES.length;
  const el=document.createElement('div');
  el.className='box msg';el.textContent=MESSAGES[i];
  el.style.left=Math.min(Math.max(cx,90),innerWidth-90)+'px';
  el.style.top=Math.max(cy-28*S,132)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2400);
}
function plant(cx,cy){
  const x=Math.floor(cx/S),y=Math.floor(cy/S),hn=document.getElementById('hint');
  if(y<hY+3){hn.textContent='ปลูกได้เฉพาะบนพื้นหญ้านะ';hn.classList.remove('gone');clearTimeout(plant.t);plant.t=setTimeout(()=>hn.classList.add('gone'),1800);return}
  if(y<hY+3)return;
  const tt=Math.random()*SPR.length|0;flowers.push({x,y,t:tt,p:FIX[tt]||PALS[Math.random()*PALS.length|0],h:10+Math.random()*9|0,born:performance.now(),boom:false});
  document.getElementById('hint').classList.add('gone');showMsg(cx,cy);
}
function frame(now){
  ctx.drawImage(bgc,0,0);
  const fs=[...flowers].sort((a,b)=>a.y-b.y);
  for(const f of fs){
    const t=now-f.born,len=Math.min(f.h,Math.floor(t/STEP)),top=f.y-len;
    px(ctx,f.x-1,f.y,3,1,'#6d4c41');px(ctx,f.x,f.y+1,1,1,'#4e342e');
    stem(ctx,f.x,top,f.y);
    const t2=t-f.h*STEP;
    if(t2<0){px(ctx,f.x-1,top-2,3,3,'#43a047');px(ctx,f.x,top-1,1,1,f.p[0])}
    else if(t2<(reduce?0:130)){px(ctx,f.x-1,top-2,3,3,f.p[0]);px(ctx,f.x,top-1,1,1,f.p[2])}
    else{
      if(!f.boom){f.boom=true;for(let i=0;i<10;i++){const a=Math.random()*6.28,s=.4+Math.random()*.8;sparks.push({x:f.x,y:top-2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.3,l:1,c:i%2?f.p[1]:'#fff3a0'})}}
      sprite(ctx,f.x,top,f.t,f.p);
    }
  }
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];p.x+=p.vx*.5;p.y+=p.vy*.5;p.vy+=.03;p.l-=.025;
    if(p.l<=0){sparks.splice(i,1);continue}
    px(ctx,Math.round(p.x),Math.round(p.y),1,1,p.c);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.addEventListener('pointerdown',e=>plant(e.clientX,e.clientY));
cv.addEventListener('pointermove',e=>{if(e.buttons&&e.pointerType!=='touch'&&Math.random()<.1)plant(e.clientX,e.clientY)});
document.getElementById('clear').addEventListener('click',()=>{flowers.length=0;sparks.length=0});
</script>
</body>
</html>
